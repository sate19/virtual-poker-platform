services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: friends_poker
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d friends_poker"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://poker:poker@postgres:5432/friends_poker?schema=public
      JWT_SECRET: change-this-in-production
      WEB_ORIGIN: http://localhost:3000
      PORT: 4000
      SEED_ADMIN_PASSWORD: Admin12345!
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    command: sh -c "pnpm prisma migrate deploy && pnpm prisma:seed && pnpm --filter @friends-poker/server start"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  postgres_data:
